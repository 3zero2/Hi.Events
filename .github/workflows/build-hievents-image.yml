# Add this workflow to your Hi.Events fork at this same path.
# Run it manually from the fork's Actions tab after syncing upstream changes.
name: Build Hi.Events for Raspberry Pi

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hievents-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Choose the image name
        id: image
        shell: bash
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.all-in-one
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hievents-arm64
          cache-to: type=gha,mode=max,scope=hievents-arm64

      - name: Show the image to use in Dockhand
        env:
          HI_EVENTS_IMAGE_NAME: ${{ steps.image.outputs.name }}
          HI_EVENTS_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          printf 'Copy this complete variable into Dockhand:\n\n```dotenv\nHI_EVENTS_IMAGE=%s@%s\n```\n' \
            "$HI_EVENTS_IMAGE_NAME" "$HI_EVENTS_IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
